# Compile-only example: GPIO numbers are illustrative, not verified wiring.
esphome:
  name: switch-matrix
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
external_components:
  - source:
      type: local
      path: ../components
    components: [switch_matrix_32_2]
spi:
  id: matrix_spi
  clk_pin: GPIO18
  mosi_pin: GPIO23
switch_matrix_32_2:
  id: matrix
  spi_id: matrix_spi
  cs_a_pin: GPIO16
  cs_b_pin: GPIO17
  oe_pin: GPIO21
  startup_state: BYPASS
  break_before_make: 10ms
select:
  - platform: switch_matrix_32_2
    matrix_id: matrix
    channel: 1
    id: matrix_ch1
    name: "Channel 01"
