button:
  - platform: template
    name: "CH1 A"
    on_press:
      - select.set:
          id: matrix_ch1
          option: "A"
  - platform: template
    name: "All bypass"
    on_press:
      - switch_matrix_32_2.bypass_all:
          id: matrix
  - platform: template
    name: "Example masks"
    on_press:
      - switch_matrix_32_2.set_masks:
          id: matrix
          mask_a: "0x00000005"
          mask_b: "0x8000000A"
