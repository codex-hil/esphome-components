# COMPILE-ONLY fixture; pins are illustrative, not an authorized wiring plan.
esphome:
  name: collection-max112xx
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
external_components:
  - source:
      type: local
      path: ../components
    components: [max112xx, spi]
spi:
  id: bus
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO34
sensor:
  - platform: max112xx
    name: MAX112xx ADC
    cs_pin: GPIO27
    update_interval: 60s
    gain: 1
    rate: 10SPS
    line_frequency: 50Hz
    reference_voltage: 2.5V
    bipolar: true
    signal_buffer: false
    reference_buffer: false
    self_calibrate: true
