# CP2102 classic ESP32 -> CPLD -> two ADS124S08. No mezzanine required.
esphome:
  name: cpld-adc-flash
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
external_components:
  - source:
      type: local
      path: ../components
    components: [ads124s08_base, spi, addrspi, moduliq_cpld_i2c, moduliq_cpld_gpio, moduliq_cpld_flash]
spi:
  id: bridge_spi
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO34
# Two levels keep module GA and chip selection stable before every CS assertion.
addrspi:
  - id: module_mux
    spi_id: bridge_spi
    address_pins: [GPIO2, GPIO4, GPIO13, GPIO18]
    channels:
      - bus_id: module0
        channel: 0
  - id: mux
    spi_id: module0
    address_pins: [GPIO16, GPIO17]
    channels:
      - bus_id: mux_ch0
        channel: 0
      - bus_id: mux_ch1
        channel: 1
      - bus_id: mux_ch2
        channel: 2
      - bus_id: mux_ch3
        channel: 3
ads124s08_base:
  - id: adc0
    spi_id: mux_ch0
    cs_pin:
      number: GPIO15
      allow_other_uses: true
    update_interval: 1s
    scan_offset: 0
    raw:
      name: ADC0 raw
    status:
      name: ADC0 status
    source:
      name: ADC0 source
    crc_errors:
      name: ADC0 CRC errors
    short_raw:
      name: ADC0 short raw
    avdd_voltage:
      name: ADC0 AVDD
    dvdd_voltage:
      name: ADC0 DVDD
    die_temperature:
      name: ADC0 die temperature
  - id: adc1
    spi_id: mux_ch1
    cs_pin:
      number: GPIO15
      allow_other_uses: true
    update_interval: 1s
    scan_offset: 1
    raw:
      name: ADC1 raw
    status:
      name: ADC1 status
    source:
      name: ADC1 source
    crc_errors:
      name: ADC1 CRC errors
    short_raw:
      name: ADC1 short raw
    avdd_voltage:
      name: ADC1 AVDD
    dvdd_voltage:
      name: ADC1 DVDD
    die_temperature:
      name: ADC1 die temperature

i2c:
  id: bridge_i2c
  sda: GPIO33
  scl: GPIO32
  scan: false
moduliq_cpld_gpio:
  id: bridge_gpio
  spi_id: mux_ch3
  cs_pin:
    number: GPIO15
    allow_other_uses: true
  module_address: 0
  board_profile: generic
  # All upper signals (digital IDs and ADS DRDY) remain inputs.
  upper_input_mask: 0xFF
moduliq_cpld_i2c:
  id: readout
  i2c_id: bridge_i2c
  module_address: 0
  board_profile: generic
  gpio_id: bridge_gpio
  upper_gpio:
    name: CPLD upper pads
  lower_gpio:
    name: CPLD lower pads
  status:
    name: CPLD readout status
  # Compile-only hypothetical comparator/Flash board, NOT the RTD16 fixture.
  adc:
    bits: 10
    timeout: 500ms
    channels:
      - channel: 0
        raw:
          name: ID ADC0 raw
        id:
          name: ID ADC0 label
        # Example code band only; requires calibration on the actual PCB.
        bands:
          - min: 100
            max: 200
            id: example_band
moduliq_cpld_flash:
  id: target_flash
  gpio_id: bridge_gpio
  target_profile: compile_only_no_hardware_assumptions
  spi_id: mux_ch2
  cs_pin:
    number: GPIO15
    allow_other_uses: true
  spi_mode: MODE0
  data_rate: 100kHz
  status:
    name: Shared Flash ownership
output:
  - platform: gpio
    id: example_open_drain
    pin:
      moduliq_cpld_gpio: bridge_gpio
      number: 5
      mode:
        output: true
        open_drain: true
