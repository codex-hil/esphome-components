# CPLD-only example: no temperature ADC, no DRDY wiring assumptions.
esphome:
  name: cpld-adc-flash
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
external_components:
- source:
    type: local
    path: ../components
  components:
  - spi
  - addrspi
  - moduliq_cpld_i2c
  - moduliq_cpld_gpio
  - moduliq_cpld_flash
spi:
  id: bridge_spi
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO34
addrspi:
- id: module_mux
  spi_id: bridge_spi
  address_pins:
  - GPIO2
  - GPIO4
  - GPIO13
  - GPIO18
  channels:
  - bus_id: module0
    channel: 0
- id: mux
  spi_id: module0
  address_pins:
  - GPIO16
  - GPIO17
  channels:
  - bus_id: mux_ch2
    channel: 2
  - bus_id: mux_ch3
    channel: 3
i2c:
  id: bridge_i2c
  sda: GPIO33
  scl: GPIO32
  scan: false
moduliq_cpld_gpio:
  id: bridge_gpio
  spi_id: mux_ch3
  cs_pin:
    number: GPIO15
    allow_other_uses: true
  module_address: 0
  upper_input_mask: 255
  enabled: false
moduliq_cpld_i2c:
  id: readout
  i2c_id: bridge_i2c
  module_address: 0
  upper_gpio:
    name: CPLD upper pads
  lower_gpio:
    name: CPLD lower pads
  status:
    name: CPLD readout status
  adc:
    bits: 10
    timeout: 500ms
    channels:
    - channel: 0
      raw:
        name: ID ADC0 raw
      id:
        name: ID ADC0 label
      bands:
      - min: 100
        max: 200
        id: example_band
    enabled: false
  gpio_id: bridge_gpio
  project_id:
    name: Project ID
    on_value:
      then:
      - lambda: '// Illustrative IDs only: replace with the application board table.

          // This YAML owns selection; the three drivers do not identify a TI ADC
          or use DRDY.

          bool gpio_board = x == 0x42 || x == 0x43;

          id(target_flash).set_enabled(x == 0x42);

          id(readout).set_adc_enabled(x == 0x43);

          id(bridge_gpio).set_enabled(gpio_board);'
moduliq_cpld_flash:
  id: target_flash
  gpio_id: bridge_gpio
  target_profile: compile_only_no_hardware_assumptions
  spi_id: mux_ch2
  cs_pin:
    number: GPIO15
    allow_other_uses: true
  spi_mode: MODE0
  data_rate: 100kHz
  status:
    name: Shared Flash ownership
  enabled: false
output:
- platform: gpio
  id: example_open_drain
  pin:
    moduliq_cpld_gpio: bridge_gpio
    number: 5
    mode:
      output: true
      open_drain: true
