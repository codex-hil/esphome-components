# CPLD-only example: no temperature ADC, no DRDY wiring assumptions.
esphome:
  name: cpld-gpio
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
external_components:
- source:
    type: local
    path: ../components
  components:
  - spi
  - addrspi
  - moduliq_cpld_i2c
  - moduliq_cpld_gpio
spi:
  id: bridge_spi
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO34
addrspi:
- id: module_mux
  spi_id: bridge_spi
  address_pins:
  - GPIO2
  - GPIO4
  - GPIO13
  - GPIO18
  channels:
  - bus_id: module0
    channel: 0
- id: mux
  spi_id: module0
  address_pins:
  - GPIO16
  - GPIO17
  channels:
  - bus_id: mux_ch3
    channel: 3
i2c:
  id: bridge_i2c
  sda: GPIO33
  scl: GPIO32
  scan: false
moduliq_cpld_gpio:
  id: bridge_gpio
  spi_id: mux_ch3
  cs_pin:
    number: GPIO15
  module_address: 0
  upper_input_mask: 255
  enabled: true
moduliq_cpld_i2c:
  id: readout
  i2c_id: bridge_i2c
  module_address: 0
  upper_gpio:
    name: CPLD upper pads
  lower_gpio:
    name: CPLD lower pads
  status:
    name: CPLD readout status
output:
- platform: gpio
  id: example_open_drain
  pin:
    moduliq_cpld_gpio: bridge_gpio
    number: 5
    mode:
      output: true
      open_drain: true
